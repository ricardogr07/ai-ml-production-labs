services:
  app:
    build:
      context: ../..
      dockerfile: labs/11-finetune-project-classifier/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  train:
    profiles: ["train"]
    build:
      context: ../..
      dockerfile: labs/11-finetune-project-classifier/Dockerfile
    command: ["uv", "run", "--frozen", "--package", "finetune-project-classifier", "python", "labs/11-finetune-project-classifier/scripts/finetune.py"]
