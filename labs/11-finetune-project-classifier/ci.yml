name: Lab 11 CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages
      - run: uv run pytest labs/11-finetune-project-classifier/tests
      - run: uv run ruff check labs/11-finetune-project-classifier
      - run: uv run pyrefly check labs/11-finetune-project-classifier/src
